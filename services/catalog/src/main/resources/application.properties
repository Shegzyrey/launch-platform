spring.application.name=catalog

# ==========================================
# Database Connection Settings
# ==========================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/laravel_test
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://lcoalhost:5432/laravel_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Flyway Migration Engine Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.schemas=catalog_db
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# JPA & Hibernate Configuration
# ==========================================
# CRITICAL: Replaced 'update' with 'validate' to let Flyway handle table creation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=catalog_db

server.port=${SERVER_PORT:8080}
